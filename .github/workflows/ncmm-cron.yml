# Public-friendly: secrets only; redact song titles/ids and nicknames in logs
name: ncmm-musician-cron

on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "ncmm subcommand"
        required: true
        default: "musician"
        type: choice
        options:
          - musician
          - task
          - sign
          - musician-vip
          - musician-sign

permissions:
  contents: read

concurrency:
  group: ncmm-cron-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.repository == '<owner>/ncmm-netease-musician'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard and mask secrets
        env:
          MUSIC_U: ${{ secrets.MUSIC_U }}
          SONG_IDS: ${{ secrets.SONG_IDS }}
          SECONDARY_MUSIC_U: ${{ secrets.SECONDARY_MUSIC_U }}
        run: |
          if [ -z "${MUSIC_U}" ]; then
            echo "::error::Secret MUSIC_U is empty."
            exit 1
          fi
          if [ -z "${SONG_IDS}" ]; then
            echo "::error::Secret SONG_IDS is empty."
            exit 1
          fi
          echo "::add-mask::${MUSIC_U}"
          echo "::add-mask::${MUSIC_U#MUSIC_U=}"
          echo "::add-mask::${SONG_IDS}"
          if [ -n "${SECONDARY_MUSIC_U}" ]; then
            echo "::add-mask::${SECONDARY_MUSIC_U}"
            echo "::add-mask::${SECONDARY_MUSIC_U#MUSIC_U=}"
            echo "secondary_cookie=yes"
          else
            echo "secondary_cookie=no (will self-play on main)"
          fi
          echo "${SONG_IDS}" | tr ',;' '\n' | while read -r id; do
            id=$(echo "$id" | tr -d '[:space:]')
            [ -n "$id" ] && echo "::add-mask::${id}"
          done
          echo "Secrets present (masked)."

      - name: Prepare data dir
        env:
          SONG_IDS: ${{ secrets.SONG_IDS }}
          SECONDARY_MUSIC_U: ${{ secrets.SECONDARY_MUSIC_U }}
        run: |
          mkdir -p data
          cp configs/config.gha.yaml data/config.yaml
          cp configs/notify.hf.yaml data/notify.yaml
          python3 <<'PY'
          import os, re, pathlib
          p = pathlib.Path("data/config.yaml")
          t = p.read_text(encoding="utf-8")
          ids = os.environ["SONG_IDS"].strip()
          if not re.fullmatch(r"[0-9,\s;]+", ids):
              raise SystemExit("SONG_IDS contains invalid characters")
          ids = re.sub(r"[;\s]+", ",", ids)
          ids = re.sub(r",+", ",", ids).strip(",")
          if not ids:
              raise SystemExit("SONG_IDS empty after normalize")
          t2, n = re.subn(
              r'(playids:\n(?:.*\n)*?\s+ids:\s*)""',
              r'\1"' + ids + '"',
              t,
              count=1,
          )
          if n != 1:
              raise SystemExit("failed to inject playids.ids")
          if not os.environ.get("SECONDARY_MUSIC_U"):
              t2 = t2.replace(
                  "  secondary:\n    - \"./fan1.json\"",
                  "  secondary: []",
              )
          p.write_text(t2, encoding="utf-8")
          print("playids injected from secret (not printed)")
          PY

      - name: Login main
        env:
          MUSIC_U: ${{ secrets.MUSIC_U }}
        run: |
          set +x
          case "${MUSIC_U}" in
            *MUSIC_U=*) C="${MUSIC_U}" ;;
            *) C="MUSIC_U=${MUSIC_U}" ;;
          esac
          # 注意：ncmm 的 --format header + -f 有 bug（读的是空 args）
          # 用位置参数 --format header 'MUSIC_U=...' -m（主号已验证可过）
          docker run --rm \
            -v "$PWD/data:/data" \
            -w /data \
            --entrypoint /usr/local/bin/ncmm \
            ghcr.io/3899/ncmm:latest \
            --home /data -c /data/config.yaml login cookie --format header "$C" -m \
            > data/login.log 2>&1 || {
              echo "::error::main login failed"
              grep -v -iE 'cookie|music_u|token|password|authorization|songid|歌名|昵称' data/login.log | tail -n 80 || true
              rm -f data/login.log data/cookie.json || true
              exit 1
            }
          # cookie 可能在 /data/cookie.json 或 accounts.main 路径
          if [ ! -f data/cookie.json ]; then
            found=$(find data -name 'cookie.json' 2>/dev/null | head -1 || true)
            if [ -n "$found" ]; then cp "$found" data/cookie.json; fi
          fi
          test -f data/cookie.json || { echo "::error::no cookie.json"; ls -la data || true; exit 1; }
          echo "main login ok bytes=$(wc -c < data/cookie.json)"
          rm -f data/login.log

      - name: Login secondary (optional)
        env:
          SECONDARY_MUSIC_U: ${{ secrets.SECONDARY_MUSIC_U }}
        run: |
          set +x
          if [ -z "${SECONDARY_MUSIC_U}" ]; then
            echo "skip secondary login"
            # 无辅助号时清空 secondary，避免 musician 找不到 fan1
            sed -i 's|  secondary:\n    - "./fan1.json"|  secondary: []|' data/config.yaml 2>/dev/null || \
            python3 -c "from pathlib import Path;p=Path('data/config.yaml');t=p.read_text();p.write_text(t.replace('  secondary:\n    - \"./fan1.json\"','  secondary: []'))"
            exit 0
          fi
          case "${SECONDARY_MUSIC_U}" in
            *MUSIC_U=*) C="${SECONDARY_MUSIC_U}" ;;
            *) C="MUSIC_U=${SECONDARY_MUSIC_U}" ;;
          esac
          # 辅助号：先写文件，再用 -f 自动探测（勿用 --format header -f，上游 bug）
          printf '%s' "$C" > data/fan1.header
          set +e
          docker run --rm \
            -v "$PWD/data:/data" \
            -w /data \
            --entrypoint /usr/local/bin/ncmm \
            ghcr.io/3899/ncmm:latest \
            --home /data -c /data/config.yaml login cookie -f /data/fan1.header -o fan1.json \
            > data/login2.log 2>&1
          RC=$?
          if [ "$RC" -ne 0 ]; then
            # 回退：位置参数 header
            docker run --rm \
              -v "$PWD/data:/data" \
              -w /data \
              --entrypoint /usr/local/bin/ncmm \
              ghcr.io/3899/ncmm:latest \
              --home /data -c /data/config.yaml login cookie --format header "$C" -o fan1.json \
              > data/login2.log 2>&1
            RC=$?
          fi
          set -e
          rm -f data/fan1.header
          if [ "$RC" -ne 0 ]; then
            echo "::warning::secondary login failed — fallback to main-only play"
            grep -v -iE 'cookie|music_u|token|password|authorization|songid|歌名|昵称' data/login2.log | tail -n 40 || true
            rm -f data/login2.log
            python3 -c "from pathlib import Path;p=Path('data/config.yaml');t=p.read_text();p.write_text(t.replace('  secondary:\n    - \"./fan1.json\"','  secondary: []'))"
            exit 0
          fi
          rm -f data/login2.log
          if [ -f data/fan1.json ]; then
            echo "secondary login ok"
          elif [ -f data/.ncmm/fan1.json ]; then
            cp data/.ncmm/fan1.json data/fan1.json
            echo "secondary login ok (from .ncmm)"
          else
            # 可能写成 fan_<uid>.json
            extra=$(find data -maxdepth 2 -name 'fan*.json' ! -name 'fan1.json' 2>/dev/null | head -1 || true)
            if [ -n "$extra" ]; then
              cp "$extra" data/fan1.json
              echo "secondary login ok (renamed $(basename "$extra"))"
            else
              echo "::warning::secondary cookie file missing — main-only play"
              python3 -c "from pathlib import Path;p=Path('data/config.yaml');t=p.read_text();p.write_text(t.replace('  secondary:\n    - \"./fan1.json\"','  secondary: []'))"
            fi
          fi

      - name: Resolve command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "value=musician" >> "$GITHUB_OUTPUT"
          else
            echo "value=task" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ncmm (redacted live logs)
        env:
          SONG_IDS: ${{ secrets.SONG_IDS }}
        run: |
          set +x
          CMD="${{ steps.cmd.outputs.value }}"
          case "$CMD" in
            musician|task|sign|musician-vip|musician-sign) ;;
            *) echo "::error::invalid command"; exit 1 ;;
          esac
          echo "running: ncmm $CMD (ids/titles/nicks redacted)"

          cat > /tmp/redact.py <<'PY'
          import os, re, sys
          ids = []
          for part in re.split(r"[,;\s]+", os.environ.get("SONG_IDS", "")):
              part = part.strip()
              if part.isdigit():
                  ids.append(part)
          ids.sort(key=len, reverse=True)
          # plain quotes and JSON-escaped quotes from slog
          title_re = re.compile(r'歌名=(?:"[^"]*"|\\"[^\\"]*\\")')
          nick_re = re.compile(r'昵称=(?:"[^"]*"|\\"[^\\"]*\\")')
          songid_re = re.compile(r"songId=\S+")
          uid_re = re.compile(r"\buid=\d+")
          for raw in sys.stdin.buffer:
              try:
                  line = raw.decode("utf-8", errors="replace")
              except Exception:
                  continue
              line = line.replace("\r", "\n")
              for chunk in line.splitlines(True):
                  s = chunk.rstrip("\n\r")
                  for i in ids:
                      s = s.replace(i, "[song]")
                  s = title_re.sub('歌名="[redacted]"', s)
                  s = nick_re.sub('昵称="[redacted]"', s)
                  s = songid_re.sub("songId=[song]", s)
                  s = uid_re.sub("uid=[redacted]", s)
                  low = s.lower()
                  if any(x in low for x in ("music_u", "authorization", "password=", "cookie=")):
                      continue
                  sys.stdout.write(s + "\n")
                  sys.stdout.flush()
          PY

          set +e
          docker run --rm \
            -v "$PWD/data:/data" \
            -w /data \
            --entrypoint /usr/local/bin/ncmm \
            ghcr.io/3899/ncmm:latest \
            --home /data -c /data/config.yaml "$CMD" 2>&1 \
            | python3 /tmp/redact.py
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::ncmm $CMD exit=${STATUS}"
            exit "${STATUS}"
          fi
          echo "ncmm $CMD finished ok"

      - name: Scrub workspace
        if: always()
        run: |
          docker run --rm -v "$PWD/data:/data" --entrypoint /bin/sh ghcr.io/3899/ncmm:latest -c 'rm -rf /data/* /data/.[!.]* 2>/dev/null || true' || true
          rm -rf data 2>/dev/null || sudo rm -rf data || true
          mkdir -p data
          echo "workspace scrubbed"
