# Public-friendly: secondary jar = clone main cookie + swap MUSIC_U
name: ncmm-musician-cron

on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "ncmm subcommand"
        required: true
        default: "musician"
        type: choice
        options:
          - musician
          - task
          - sign
          - musician-vip
          - musician-sign

permissions:
  contents: read

concurrency:
  group: ncmm-cron-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.repository == '<owner>/ncmm-netease-musician'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard and mask secrets
        env:
          MUSIC_U: ${{ secrets.MUSIC_U }}
          SONG_IDS: ${{ secrets.SONG_IDS }}
          SECONDARY_MUSIC_U: ${{ secrets.SECONDARY_MUSIC_U }}
        run: |
          if [ -z "${MUSIC_U}" ]; then
            echo "::error::Secret MUSIC_U is empty."
            exit 1
          fi
          if [ -z "${SONG_IDS}" ]; then
            echo "::error::Secret SONG_IDS is empty."
            exit 1
          fi
          echo "::add-mask::${MUSIC_U}"
          echo "::add-mask::${MUSIC_U#MUSIC_U=}"
          echo "::add-mask::${SONG_IDS}"
          if [ -n "${SECONDARY_MUSIC_U}" ]; then
            echo "::add-mask::${SECONDARY_MUSIC_U}"
            echo "::add-mask::${SECONDARY_MUSIC_U#MUSIC_U=}"
            echo "secondary_secret=yes"
          else
            echo "secondary_secret=no"
          fi
          echo "${SONG_IDS}" | tr ',;' '
' | while read -r id; do
            id=$(echo "$id" | tr -d '[:space:]')
            [ -n "$id" ] && echo "::add-mask::${id}"
          done
          echo "Secrets present (masked)."

      - name: Prepare data dir
        env:
          SONG_IDS: ${{ secrets.SONG_IDS }}
        run: |
          mkdir -p data
          cp configs/config.gha.yaml data/config.yaml
          cp configs/notify.hf.yaml data/notify.yaml
          python3 scripts/inject_songs.py

      - name: Login main
        env:
          MUSIC_U: ${{ secrets.MUSIC_U }}
        run: |
          set +x
          case "${MUSIC_U}" in
            *MUSIC_U=*) C="${MUSIC_U}" ;;
            *) C="MUSIC_U=${MUSIC_U}" ;;
          esac
          docker run --rm             -v "$PWD/data:/data"             -w /data             --entrypoint /usr/local/bin/ncmm             ghcr.io/3899/ncmm:latest             --home /data -c /data/config.yaml login cookie --format header "$C" -m             > data/login.log 2>&1 || {
              echo "::error::main login failed"
              grep -v -iE 'cookie|music_u|token|password|authorization|songid|歌名|昵称' data/login.log | tail -n 80 || true
              rm -f data/login.log data/cookie.json || true
              exit 1
            }
          if [ ! -f data/cookie.json ]; then
            found=$(find data -name 'cookie.json' 2>/dev/null | head -1 || true)
            if [ -n "$found" ]; then cp "$found" data/cookie.json; fi
          fi
          test -f data/cookie.json || { echo "::error::no cookie.json"; exit 1; }
          echo "main login ok bytes=$(wc -c < data/cookie.json)"
          rm -f data/login.log

      - name: Build secondary jar
        env:
          SECONDARY_MUSIC_U: ${{ secrets.SECONDARY_MUSIC_U }}
        run: |
          set +x
          if [ -z "${SECONDARY_MUSIC_U}" ]; then
            echo "no secondary; main-only"
            exit 0
          fi
          case "${SECONDARY_MUSIC_U}" in
            *MUSIC_U=*) export SEC="${SECONDARY_MUSIC_U#MUSIC_U=}" ;;
            *) export SEC="${SECONDARY_MUSIC_U}" ;;
          esac
          python3 scripts/build_secondary_jar.py

      - name: Resolve command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "value=musician" >> "$GITHUB_OUTPUT"
          else
            echo "value=task" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ncmm (redacted live logs)
        env:
          SONG_IDS: ${{ secrets.SONG_IDS }}
        run: |
          set +x
          CMD="${{ steps.cmd.outputs.value }}"
          case "$CMD" in
            musician|task|sign|musician-vip|musician-sign) ;;
            *) echo "::error::invalid command"; exit 1 ;;
          esac
          echo "running: ncmm $CMD (redacted)"
          set +e
          docker run --rm             -v "$PWD/data:/data"             -w /data             --entrypoint /usr/local/bin/ncmm             ghcr.io/3899/ncmm:latest             --home /data -c /data/config.yaml "$CMD" 2>&1             | python3 scripts/redact_logs.py
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::ncmm $CMD exit=${STATUS}"
            exit "${STATUS}"
          fi
          echo "ncmm $CMD finished ok"

      - name: Scrub workspace
        if: always()
        run: |
          docker run --rm -v "$PWD/data:/data" --entrypoint /bin/sh ghcr.io/3899/ncmm:latest -c 'rm -rf /data/* /data/.[!.]* 2>/dev/null || true' || true
          rm -rf data 2>/dev/null || sudo rm -rf data || true
          mkdir -p data
          echo "workspace scrubbed"
