# Public-friendly: secrets only; live filtered logs; short play batches for Actions
name: ncmm-musician-cron

on:
  schedule:
    # UTC 00:30 ≈ Beijing 08:30 → task（日常，通常较快）
    - cron: "30 0 * * *"
    # UTC 06:00 ≈ Beijing 14:00 → musician（含少量播放）
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "ncmm subcommand"
        required: true
        default: "musician"
        type: choice
        options:
          - musician
          - task
          - sign
          - musician-vip
          - musician-sign

permissions:
  contents: read

concurrency:
  group: ncmm-cron-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 每首真实等待时长，5 首也可能 20～30 分钟；留余量
    timeout-minutes: 60
    if: github.repository == '<owner>/ncmm-netease-musician'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard and mask secrets
        env:
          MUSIC_U: ${{ secrets.MUSIC_U }}
        run: |
          if [ -z "${MUSIC_U}" ]; then
            echo "::error::Secret MUSIC_U is empty."
            exit 1
          fi
          echo "::add-mask::${MUSIC_U}"
          echo "::add-mask::${MUSIC_U#MUSIC_U=}"
          echo "Secret present (masked). length=${#MUSIC_U}"

      - name: Prepare data dir
        run: |
          mkdir -p data
          # Actions 用少播放配置，避免超时
          cp configs/config.gha.yaml data/config.yaml
          cp configs/notify.hf.yaml data/notify.yaml

      - name: Login (cookie never printed)
        env:
          MUSIC_U: ${{ secrets.MUSIC_U }}
        run: |
          set +x
          case "${MUSIC_U}" in
            *MUSIC_U=*) C="${MUSIC_U}" ;;
            *) C="MUSIC_U=${MUSIC_U}" ;;
          esac
          docker run --rm \
            -v "$PWD/data:/data" \
            --entrypoint /usr/local/bin/ncmm \
            ghcr.io/3899/ncmm:latest \
            -c /data/config.yaml login cookie "$C" -m \
            > data/login.log 2>&1 || {
              echo "::error::login failed (details redacted)"
              grep -v -iE 'cookie|music_u|token|password|authorization' data/login.log | tail -n 40 || true
              rm -f data/login.log data/cookie.json || true
              exit 1
            }
          test -f data/cookie.json || { echo "::error::no cookie.json"; exit 1; }
          echo "login ok; cookie file bytes=$(wc -c < data/cookie.json)"
          rm -f data/login.log

      - name: Resolve command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "value=musician" >> "$GITHUB_OUTPUT"
          else
            echo "value=task" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ncmm (live filtered logs)
        run: |
          set +x
          CMD="${{ steps.cmd.outputs.value }}"
          case "$CMD" in
            musician|task|sign|musician-vip|musician-sign) ;;
            *) echo "::error::invalid command"; exit 1 ;;
          esac
          echo "running: ncmm $CMD (live log; secrets masked)"
          # 实时输出；过滤敏感词；进度条 \r 转成换行方便 Actions 显示
          set +e
          docker run --rm \
            -v "$PWD/data:/data" \
            --entrypoint /usr/local/bin/ncmm \
            ghcr.io/3899/ncmm:latest \
            -c /data/config.yaml "$CMD" 2>&1 \
            | tr '\r' '\n' \
            | grep -v -iE 'cookie|music_u|token=|password|authorization|MUSIC_U' \
            | tee data/run.filtered.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::ncmm $CMD exit=${STATUS}"
            exit "${STATUS}"
          fi
          echo "ncmm $CMD finished ok"

      - name: Scrub workspace
        if: always()
        run: |
          # 容器可能以 root 写 log/database，用 docker 删最干净
          docker run --rm -v "$PWD/data:/data" --entrypoint /bin/sh ghcr.io/3899/ncmm:latest -c 'rm -rf /data/* /data/.[!.]* 2>/dev/null || true' || true
          rm -rf data 2>/dev/null || sudo rm -rf data || true
          mkdir -p data
          echo "workspace scrubbed"
