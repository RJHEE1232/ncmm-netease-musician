# Public-friendly: secrets only; redact song titles/ids/nicks in logs
name: ncmm-musician-cron

on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "ncmm subcommand"
        required: true
        default: "musician"
        type: choice
        options:
          - musician
          - task
          - sign
          - musician-vip
          - musician-sign

permissions:
  contents: read

concurrency:
  group: ncmm-cron-${{ github.repository }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.repository == '<owner>/ncmm-netease-musician'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard and mask secrets
        env:
          MUSIC_U: ${{ secrets.MUSIC_U }}
          SONG_IDS: ${{ secrets.SONG_IDS }}
        run: |
          if [ -z "${MUSIC_U}" ]; then
            echo "::error::Secret MUSIC_U is empty."
            exit 1
          fi
          if [ -z "${SONG_IDS}" ]; then
            echo "::error::Secret SONG_IDS is empty."
            exit 1
          fi
          echo "::add-mask::${MUSIC_U}"
          echo "::add-mask::${MUSIC_U#MUSIC_U=}"
          echo "::add-mask::${SONG_IDS}"
          echo "${SONG_IDS}" | tr ',;' '\n' | while read -r id; do
            id=$(echo "$id" | tr -d '[:space:]')
            [ -n "$id" ] && echo "::add-mask::${id}"
          done
          echo "Secrets present (masked)."

      - name: Prepare data dir
        env:
          SONG_IDS: ${{ secrets.SONG_IDS }}
        run: |
          mkdir -p data
          cp configs/config.gha.yaml data/config.yaml
          cp configs/notify.hf.yaml data/notify.yaml
          python3 <<'PY'
          import os, re
          from pathlib import Path
          p = Path("data/config.yaml")
          t = p.read_text(encoding="utf-8")
          ids = os.environ["SONG_IDS"].strip()
          if not re.fullmatch(r"[0-9,\s;]+", ids):
              raise SystemExit("SONG_IDS contains invalid characters")
          ids = re.sub(r"[;\s]+", ",", ids)
          ids = re.sub(r",+", ",", ids).strip(",")
          if not ids:
              raise SystemExit("SONG_IDS empty after normalize")
          t2, n = re.subn(
              r'(playids:\n(?:.*\n)*?\s+ids:\s*)""',
              r'\1"' + ids + '"',
              t,
              count=1,
          )
          if n != 1:
              raise SystemExit("failed to inject playids.ids")
          # main self-play only (secondary login panics in upstream ncmm)
          t2 = re.sub(r"(?m)^(\s*secondary:\s*).*(?:\n\s*-\s*\"[^\"]+\")*", r"\1[]", t2, count=1)
          t2 = t2.replace("enableMain: false", "enableMain: true")
          p.write_text(t2, encoding="utf-8")
          print("config ready: main self-play, song ids injected")
          PY

      - name: Login main
        env:
          MUSIC_U: ${{ secrets.MUSIC_U }}
        run: |
          set +x
          case "${MUSIC_U}" in
            *MUSIC_U=*) C="${MUSIC_U}" ;;
            *) C="MUSIC_U=${MUSIC_U}" ;;
          esac
          docker run --rm \
            -v "$PWD/data:/data" \
            -w /data \
            --entrypoint /usr/local/bin/ncmm \
            ghcr.io/3899/ncmm:latest \
            --home /data -c /data/config.yaml login cookie --format header "$C" -m \
            > data/login.log 2>&1 || {
              echo "::error::main login failed"
              grep -v -iE 'cookie|music_u|token|password|authorization|songid|歌名|昵称' data/login.log | tail -n 80 || true
              rm -f data/login.log data/cookie.json || true
              exit 1
            }
          if [ ! -f data/cookie.json ]; then
            found=$(find data -name 'cookie.json' 2>/dev/null | head -1 || true)
            if [ -n "$found" ]; then cp "$found" data/cookie.json; fi
          fi
          test -f data/cookie.json || { echo "::error::no cookie.json"; ls -la data || true; exit 1; }
          echo "main login ok bytes=$(wc -c < data/cookie.json)"
          rm -f data/login.log

      - name: Resolve command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "value=musician" >> "$GITHUB_OUTPUT"
          else
            echo "value=task" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ncmm (redacted live logs)
        env:
          SONG_IDS: ${{ secrets.SONG_IDS }}
        run: |
          set +x
          CMD="${{ steps.cmd.outputs.value }}"
          case "$CMD" in
            musician|task|sign|musician-vip|musician-sign) ;;
            *) echo "::error::invalid command"; exit 1 ;;
          esac
          echo "running: ncmm $CMD (ids/titles/nicks redacted)"

          cat > /tmp/redact.py <<'PY'
          import os, re, sys
          ids = []
          for part in re.split(r"[,;\s]+", os.environ.get("SONG_IDS", "")):
              part = part.strip()
              if part.isdigit():
                  ids.append(part)
          ids.sort(key=len, reverse=True)
          title_re = re.compile(r'歌名=(?:"[^"]*"|\\"[^\\"]*\\")')
          nick_re = re.compile(r'昵称=(?:"[^"]*"|\\"[^\\"]*\\")')
          songid_re = re.compile(r"songId=\S+")
          uid_re = re.compile(r"\buid=\d+")
          for raw in sys.stdin.buffer:
              try:
                  line = raw.decode("utf-8", errors="replace")
              except Exception:
                  continue
              line = line.replace("\r", "\n")
              for chunk in line.splitlines(True):
                  s = chunk.rstrip("\n\r")
                  for i in ids:
                      s = s.replace(i, "[song]")
                  s = title_re.sub('歌名="[redacted]"', s)
                  s = nick_re.sub('昵称="[redacted]"', s)
                  s = songid_re.sub("songId=[song]", s)
                  s = uid_re.sub("uid=[redacted]", s)
                  low = s.lower()
                  if any(x in low for x in ("music_u", "authorization", "password=", "cookie=")):
                      continue
                  sys.stdout.write(s + "\n")
                  sys.stdout.flush()
          PY

          set +e
          docker run --rm \
            -v "$PWD/data:/data" \
            -w /data \
            --entrypoint /usr/local/bin/ncmm \
            ghcr.io/3899/ncmm:latest \
            --home /data -c /data/config.yaml "$CMD" 2>&1 \
            | python3 /tmp/redact.py
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::ncmm $CMD exit=${STATUS}"
            exit "${STATUS}"
          fi
          echo "ncmm $CMD finished ok"

      - name: Scrub workspace
        if: always()
        run: |
          docker run --rm -v "$PWD/data:/data" --entrypoint /bin/sh ghcr.io/3899/ncmm:latest -c 'rm -rf /data/* /data/.[!.]* 2>/dev/null || true' || true
          rm -rf data 2>/dev/null || sudo rm -rf data || true
          mkdir -p data
          echo "workspace scrubbed"
